{% extends "base.html" %}

{% block title %}Agendamento Admin - DoctorCare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="card-title mb-0">
                    <i class="fas fa-calendar-plus me-2"></i>Agendar Consulta (Administrativo)
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('agendamento_admin') }}">
                    <!-- Campo Paciente (obrigatório para admin) -->
                    <div class="mb-3">
                        <label for="paciente" class="form-label">
                            <strong>Paciente *</strong>
                        </label>
                        <select class="form-select" id="paciente" name="paciente" required>
                            <option value="">Selecione um paciente</option>
                            {% for paciente in pacientes %}
                            <option value="{{ paciente[0] }}">{{ paciente[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Campo Médico -->
                    <div class="mb-3">
                        <label for="medico" class="form-label">
                            <strong>Médico *</strong>
                        </label>
                        <select class="form-select" id="medico" name="medico" required>
                            <option value="">Selecione um médico</option>
                            {% for medico in medicos %}
                            <option value="{{ medico[0] }}">
                                Dr. {{ medico[1] }} - {{ medico[2] }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Data e Hora -->
                    <div class="mb-3">
                        <label for="data_hora" class="form-label">
                            <strong>Data e Hora *</strong>
                        </label>
                        <input type="datetime-local" class="form-control" id="data_hora" name="data_hora" required
                               min="{{ datetime.now().strftime('%Y-%m-%dT%H:%M') }}">
                    </div>

                    <!-- Observações -->
                    <div class="mb-4">
                        <label for="observacoes" class="form-label">
                            <strong>Observações</strong>
                        </label>
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="3" 
                                  placeholder="Observações sobre a consulta..."></textarea>
                    </div>

                    <!-- Botões -->
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('consultas_admin') }}" class="btn btn-secondary me-md-2">
                            <i class="fas fa-arrow-left me-2"></i>Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-calendar-check me-2"></i>Agendar Consulta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
