<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Médico - DoctorIA</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }
        
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            margin: 4px 8px;
            border-radius: 8px;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .sidebar .nav-link.active {
            background: white;
            color: #667eea;
        }
        
        .main-content {
            padding: 30px;
        }
        
        .page-title {
            margin-bottom: 30px;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 24px;
        }
        
        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-label {
            color: #7f8c8d;
            font-weight: 500;
        }
        
        .form-control, .form-select {
            border: 2px solid #ecf0f1;
            border-radius: 12px;
            padding: 12px 15px;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);
            color: white;
        }
        
        .btn-cancel {
            background: #ecf0f1;
            color: #7f8c8d;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .status-toggle {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .form-switch {
            padding-left: 2.5em;
        }
        
        .form-switch .form-check-input {
            width: 3em;
            height: 1.5em;
            margin-left: -2.5em;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 sidebar">
                <div class="p-4">
                    <h4 class="text-white mb-4">
                        <i class="fas fa-brain me-2"></i>
                        Doctor<span class="fw-light">IA</span>
                    </h4>
                    
                    <nav class="nav flex-column">
                        <a class="nav-link" href="{{ url_for('admin.dashboard') }}">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                        <a class="nav-link active" href="{{ url_for('admin.medicos') }}">
                            <i class="fas fa-user-md"></i> Médicos
                        </a>
                        <a class="nav-link" href="{{ url_for('admin.analistas') }}">
                            <i class="fas fa-microscope"></i> Analistas
                        </a>
                        <a class="nav-link" href="{{ url_for('admin.pacientes') }}">
                            <i class="fas fa-users"></i> Pacientes
                        </a>
                        <hr>
                        <a class="nav-link" href="{{ url_for('auth.logout') }}">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </a>
                    </nav>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 main-content">
                <div class="page-title">
                    <a href="{{ url_for('admin.medicos') }}" class="text-decoration-none text-dark">
                        <i class="fas fa-arrow-left me-2"></i>
                    </a>
                    <i class="fas fa-edit ms-2"></i>
                    Editar Médico
                </div>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <div class="form-card">
                    <h4 class="text-center mb-4">
                        <i class="fas fa-user-md text-primary me-2"></i>
                        {{ medico[1] }}
                    </h4>
                    
                    <form method="POST">
                        <div class="status-toggle">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="ativo" 
                                       id="statusSwitch" {% if medico[3] == 1 %}checked{% endif %}>
                                <label class="form-check-label" for="statusSwitch">
                                    <strong>Usuário Ativo</strong>
                                </label>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" name="nome" 
                                   value="{{ medico[1] }}" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" 
                                   value="{{ medico[2] }}" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Especialidade</label>
                                <select class="form-select" name="especialidade" required>
                                    <option value="Cardiologia" {% if medico[4] == 'Cardiologia' %}selected{% endif %}>Cardiologia</option>
                                    <option value="Dermatologia" {% if medico[4] == 'Dermatologia' %}selected{% endif %}>Dermatologia</option>
                                    <option value="Neurologia" {% if medico[4] == 'Neurologia' %}selected{% endif %}>Neurologia</option>
                                    <option value="Ortopedia" {% if medico[4] == 'Ortopedia' %}selected{% endif %}>Ortopedia</option>
                                    <option value="Pediatria" {% if medico[4] == 'Pediatria' %}selected{% endif %}>Pediatria</option>
                                    <option value="Psiquiatria" {% if medico[4] == 'Psiquiatria' %}selected{% endif %}>Psiquiatria</option>
                                    <option value="Radiologia" {% if medico[4] == 'Radiologia' %}selected{% endif %}>Radiologia</option>
                                    <option value="Clínico Geral" {% if medico[4] == 'Clínico Geral' %}selected{% endif %}>Clínico Geral</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-4">
                                <label class="form-label">CRM</label>
                                <input type="text" class="form-control" name="crm" 
                                       value="{{ medico[5] }}" required>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn-submit">
                                <i class="fas fa-save me-2"></i>
                                Salvar Alterações
                            </button>
                            <a href="{{ url_for('admin.medicos') }}" class="btn-cancel">
                                <i class="fas fa-times me-2"></i>
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
