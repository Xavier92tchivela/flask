{% extends "base.html" %}

{% block title %}Adicionar Medicamento - Farmacêutico{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-plus-circle me-2"></i>
                        Adicionar Novo Medicamento
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Nome do Medicamento *</label>
                                <input type="text" name="nome" class="form-control" required>
                            </div>
                            
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Descrição</label>
                                <textarea name="descricao" class="form-control" rows="3"></textarea>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Categoria</label>
                                <select name="categoria" class="form-select">
                                    <option value="">Selecione...</option>
                                    <option value="Analgésicos">Analgésicos</option>
                                    <option value="Anti-inflamatórios">Anti-inflamatórios</option>
                                    <option value="Antibióticos">Antibióticos</option>
                                    <option value="Cardiovasculares">Cardiovasculares</option>
                                    <option value="Endócrinos">Endócrinos</option>
                                    <option value="Gastrointestinais">Gastrointestinais</option>
                                    <option value="Psicotrópicos">Psicotrópicos</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                            
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Quantidade Inicial *</label>
                                <input type="number" name="quantidade" class="form-control" value="0" min="0" required>
                            </div>
                            
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Unidade</label>
                                <select name="unidade" class="form-select">
                                    <option value="unidade">Unidade</option>
                                    <option value="comprimidos">Comprimidos</option>
                                    <option value="cápsulas">Cápsulas</option>
                                    <option value="ml">ml</option>
                                    <option value="ampolas">Ampolas</option>
                                    <option value="frascos">Frascos</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estoque Mínimo</label>
                                <input type="number" name="estoque_minimo" class="form-control" value="10" min="0">
                                <small class="text-muted">Quantidade mínima para alerta de estoque baixo</small>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Lote</label>
                                <input type="text" name="lote" class="form-control">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data de Validade</label>
                                <input type="date" name="data_validade" class="form-control">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fornecedor</label>
                                <select name="fornecedor_id" class="form-select">
                                    <option value="">Selecione...</option>
                                    {% for f in fornecedores %}
                                    <option value="{{ f.id }}">{{ f.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço de Custo (R$)</label>
                                <input type="number" name="preco_custo" class="form-control" step="0.01">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço de Venda (R$)</label>
                                <input type="number" name="preco_venda" class="form-control" step="0.01">
                            </div>
                            
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Localização no Estoque</label>
                                <input type="text" name="localizacao" class="form-control" placeholder="Ex: Prateleira A1, Gaveta 2...">
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between mt-3">
                            <a href="{{ url_for('farmaceutico.estoque') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-2"></i>Salvar Medicamento
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
