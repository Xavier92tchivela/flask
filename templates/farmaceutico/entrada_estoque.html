{% extends "base.html" %}

{% block title %}Entrada de Estoque - Farmacêutico{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-plus-circle me-2"></i>
                        Registrar Entrada de Estoque
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label">Produto *</label>
                                <select name="produto_id" class="form-select" required>
                                    <option value="">Selecione um produto...</option>
                                    {% for p in produtos %}
                                    <option value="{{ p.id }}">{{ p.nome }} ({{ p.codigo_interno }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Número do Lote *</label>
                                <input type="text" name="lote" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fornecedor</label>
                                <select name="fornecedor_id" class="form-select">
                                    <option value="">Selecione...</option>
                                    {% for f in fornecedores %}
                                    <option value="{{ f.id }}">{{ f.nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data de Fabricação</label>
                                <input type="date" name="data_fabricacao" class="form-control">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data de Validade *</label>
                                <input type="date" name="data_validade" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quantidade *</label>
                                <input type="number" name="quantidade" class="form-control" min="1" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço de Compra (R$)</label>
                                <input type="number" name="preco_compra" class="form-control" step="0.01">
                            </div>
                        </div>
                        
                        <div class="alert alert-info mt-3">
                            <i class="fas fa-info-circle me-2"></i>
                            Após registrar a entrada, o produto ficará disponível no estoque.
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('farmaceutico.estoque') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-2"></i>Registrar Entrada
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
