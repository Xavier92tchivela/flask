{% extends "base.html" %}

{% block title %}Agendar Consulta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>Agendar Nova Consulta</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('agendamento') }}">
                    <div class="mb-3">
                        <label for="paciente" class="form-label">Paciente</label>
                        <select class="form-select" id="paciente" name="paciente" required>
                            <option value="">Selecione um paciente</option>
                            {% for paciente in pacientes %}
                            <option value="{{ paciente[0] }}">{{ paciente[1] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="medico" class="form-label">Médico</label>
                        <select class="form-select" id="medico" name="medico" required>
                            <option value="">Selecione um médico</option>
                            {% for medico in medicos %}
                            <option value="{{ medico[0] }}">{{ medico[1] }} - {{ medico[2] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="data_hora" class="form-label">Data e Hora</label>
                        <input type="datetime-local" class="form-control" id="data_hora" name="data_hora" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="observacoes" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="3"></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Agendar Consulta</button>
                        <a href="{{ url_for('consultas') }}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
